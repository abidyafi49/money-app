<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Transaction</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-xl mx-auto p-4 sm:p-6">
      <h1 class="text-lg font-semibold text-gray-700 mb-4">Edit Transaction</h1>

      <form
        action="{{ url_for('update', t_id=transaction.id) }}"
        method="POST"
        class="bg-white rounded-xl shadow p-4 space-y-3"
      >
        <input
          type="number"
          name="amount"
          step="0.01"
          value="{{ transaction.amount }}"
          required
          class="w-full border border-gray-300 rounded-md p-2 text-sm"
        />

        <select
          name="t_type"
          class="w-full border border-gray-300 rounded-md p-2 text-sm"
        >
          {% if transaction.type == "income" %}
          <option value="income" selected>Income</option>
          <option value="expense">Expense</option>
          {% else %}
          <option value="income">Income</option>
          <option value="expense" selected>Expense</option>
          {% endif %}
        </select>

        <input
          type="text"
          name="category"
          value="{{ transaction.category }}"
          required
          class="w-full border border-gray-300 rounded-md p-2 text-sm"
        />

        <button
          type="submit"
          class="w-full bg-gray-800 hover:bg-gray-900 text-white py-2 rounded-md text-sm font-medium"
        >
          Save Changes
        </button>
      </form>
    </div>
  </body>
</html>
